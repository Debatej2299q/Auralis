name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Auralis-debug.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-debug-apk
          path: out/*.apk
          retention-days: 30

  release-apk:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.AURALIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auralis.jks"
            echo "AURALIS_KEYSTORE=$RUNNER_TEMP/auralis.jks" >> "$GITHUB_ENV"
            echo "Keystore loaded - release will be signed with your key."
          else
            echo "No keystore secret found - using the debug key so the APK still installs."
          fi

      - name: Build release APK
        env:
          AURALIS_KEYSTORE_PASSWORD: ${{ secrets.AURALIS_KEYSTORE_PASSWORD }}
          AURALIS_KEY_ALIAS: ${{ secrets.AURALIS_KEY_ALIAS }}
          AURALIS_KEY_PASSWORD: ${{ secrets.AURALIS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Auralis-release.apk || \
            cp app/build/outputs/apk/release/app-release-unsigned.apk out/Auralis-release.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-release-apk
          path: out/*.apk

      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
